name: Build Smart TMJ Pro Android APK

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch containing the approved app design"
        required: true
        default: "feature/premium-dark-ui"

permissions:
  contents: read

concurrency:
  group: smart-tmj-pro-android-apk
  cancel-in-progress: false

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview APK with Expo EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN repository secret. Add an Expo access token in GitHub Actions secrets."
            exit 1
          fi
          npx eas-cli build --platform android --profile preview --non-interactive

      - name: Download the completed APK from EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p artifacts
          npx eas-cli build:download --latest --platform android --path artifacts/Smart-TMJ-Pro-preview.apk
          test -s artifacts/Smart-TMJ-Pro-preview.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-TMJ-Pro-Android-APK
          path: artifacts/Smart-TMJ-Pro-preview.apk
          if-no-files-found: error
          retention-days: 14
