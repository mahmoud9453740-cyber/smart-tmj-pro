name: Smart TMJ Pro validation

on:
  push:
    branches:
      - feature/premium-dark-ui
  pull_request:
    branches:
      - main
      - feature/premium-dark-ui
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Repair and validate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize npm lockfile"
            git push
          fi
      - name: Install dependencies
        run: npm ci
      - name: Check Expo configuration
        run: npx expo config --type public
      - name: Export Android and iOS bundles
        run: npx expo export --platform all
