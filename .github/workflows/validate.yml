name: Smart TMJ Pro validation

on:
  push:
    branches:
      - feature/premium-dark-ui
  pull_request:
    branches:
      - main
      - feature/premium-dark-ui
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Repair and validate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Check Gemini server syntax
        run: node --check server.js
      - name: Check Expo configuration
        run: npx expo config --type public
      - name: Check Expo package compatibility
        run: npx expo-doctor
      - name: Export Android and iOS bundles
        run: npx expo export --platform all
